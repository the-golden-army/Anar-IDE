<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anar</title>
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('anar.theme') || 'system';
          var resolved =
            mode === 'system'
              ? window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
              : mode === 'light'
                ? 'light'
                : 'dark';
          document.documentElement.dataset.theme = resolved;
          document.documentElement.style.colorScheme = resolved;
          var rawPrefs = localStorage.getItem('anar.preferences');
          if (rawPrefs) {
            var parsedPrefs = JSON.parse(rawPrefs);
            var zoom =
              parsedPrefs &&
              parsedPrefs.layout &&
              typeof parsedPrefs.layout.zoomPercent === 'number'
                ? Math.min(160, Math.max(70, Math.round(parsedPrefs.layout.zoomPercent)))
                : 100;
            document.documentElement.style.fontSize = (16 * zoom) / 100 + 'px';
            document.documentElement.style.setProperty(
              '--editor-font-size',
              Number(((13 * zoom) / 100).toFixed(2)) + 'px',
            );
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
