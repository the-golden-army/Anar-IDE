name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Linux Tauri system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libxdo-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Frontend lint (ESLint)
        working-directory: apps/desktop
        run: npm run lint

      - name: Frontend format check (Prettier)
        working-directory: apps/desktop
        run: npm run format:check

      - name: Frontend typecheck (tsc --noEmit)
        working-directory: apps/desktop
        run: npm run typecheck

      - name: Frontend tests (Vitest)
        working-directory: apps/desktop
        run: npm test

      - name: Frontend build (Vite)
        working-directory: apps/desktop
        run: npm run build

      - name: Rust format check
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        shell: bash
        run: |
          if ! OUT=$(cargo test --workspace --all-targets 2>&1); then
            echo "$OUT"
            if [ "${{ runner.os }}" = "Windows" ]; then
              FLAT=$(printf '%s' "$OUT" | tail -n 60 | sed ':a;N;$!ba;s/\n/ | /g' || true)
              for i in 0 1000 2000 3000; do
                CHUNK="${FLAT:$i:1000}"
                if [ -n "$CHUNK" ]; then
                  echo "::warning::$CHUNK"
                fi
              done
            fi
            exit 1
          fi
