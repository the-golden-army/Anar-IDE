name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Linux Tauri system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libxdo-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Frontend lint (ESLint)
        working-directory: apps/desktop
        run: npm run lint

      - name: Frontend format check (Prettier)
        working-directory: apps/desktop
        run: npm run format:check

      - name: Frontend typecheck (tsc --noEmit)
        working-directory: apps/desktop
        run: npm run typecheck

      - name: Frontend tests (Vitest)
        working-directory: apps/desktop
        run: npm test

      - name: Frontend build (Vite)
        working-directory: apps/desktop
        run: npm run build

      - name: Rust format check
        run: cargo fmt --all -- --check

      - name: Rust clippy
        if: runner.os != 'Linux'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust clippy (diagnostic)
        if: runner.os == 'Linux'
        run: |
          if ! cargo clippy --workspace --all-targets -- -D warnings 2> clippy.err; then
            python3 -c 'import pathlib; s=pathlib.Path("clippy.err").read_text()[-1800:].replace("%","%25").replace("\r","%0D").replace("\n","%0A"); print(f"::error::{s}")'
            exit 1
          fi

      - name: Rust tests
        run: cargo test --workspace --all-targets
